<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Linie</title>
    <style>
        body{
            background:#C0D6E7;
            margin:0;
        }
        .block{
            width: 39px;
            height: 150px;
            background: #2D3464;
        }
        .b_place{
            position: relative;
            left: 50px;
        }
        .b1_place{
            position:absolute;
            top:0;
            left:311px;
        }
        .lin{
            width: 160px;
            height: 20px;
            background:#CC5360;
            position:absolute;
            top:20px;
            left:120px;
            box-shadow:0 40px #CC5360,
            0 80px #CC5360,
            0 120px #CC5360;
        }
        .lin1{
            width: 302px;
            height: 20px;
            background:#CC5360;
            position:relative;
            left: 50px;
            top:30px;
        }
    </style>
</head>
<body>
<div class="block b_place"></div>
<div class="block b1_place"></div>
<div class="lin"></div>
<div class="lin1"></div>

</body>
</html>
