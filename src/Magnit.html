<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Magnit</title>
    <style>
        body{
            background:#F8F5F1;
            margin:0;
        }
        .qud{
            width: 20px;
            height: 20px;
            border: 10px solid #4355CC;
            background: #F8F5F1;
            position: absolute;
            top: 60px;
            z-index: 1;
        }
        .q{
            left:120px;
        }
        .q1{
            left:240px;
        }
        .kr{
            width: 140px;
            height: 130px;
            position: absolute;
            background:#FCC9E3;
            border: 10px solid #4355CC;
            border-radius: 0 0 80px 80px;
            top: 90px;
            left: 120px;
        }
        .kr1{
            position: absolute;
            left: 150px;
            top: 60px;
            width: 80px;
            height: 140px;
            background: #F8F5F1;
            border: 10px solid #4355CC;
            border-top: 0;
            border-radius: 0 0 50px 50px;
        }
    </style>

</head>
<body>
<div class="qud q"></div>
<div class="qud q1"></div>
<div class="kr"></div>
<div class="kr1"></div>
</body>
</html>
